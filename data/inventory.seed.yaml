# Inventory seed — loaded into the `inventory_items` table on INITIAL DEPLOYMENT only
# (i.e. when the catalog is empty). After that, the database is the source of truth and this
# file is not re-read; a future input UI is how the household edits stock.
#
# Every item starts at status "none" (nothing assumed on hand) so the first thing you do is
# mark what you actually have. This just lifts the workload of typing the whole catalog in.
#   status:   have | low | none   (seed ships everything as "none")
#     have -> on hand; may be the main ingredient of a dinner
#     low  -> still usable, but not as the main ingredient; never auto-added to the shopping list
#     none -> out of stock; bought if a chosen recipe needs it (pantry staples exempt)
#   location: fridge | shelf | freezer
#   best_before: optional, display-only — glance at it to use things before they spoil
# quantity/unit are intentionally omitted (unused); add them back per-item only if you want.

