<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toddler Dinner Planner</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/fonts.css">
  <style>
    :root{ --ink:#211c16; --cream:#f4efe6; --paper:#fffdf9; --bronze:#9a7b46; --line:#e5ddce; --muted:#8c8374; }
    *{ box-sizing:border-box; }
    body{ font-family:'Inter',system-ui,sans-serif; background:var(--cream); color:var(--ink);
          max-width:800px; margin:0 auto; padding:2.75rem 1.25rem 4rem; line-height:1.5; }

    .app-header{ text-align:center; margin-bottom:1.75rem; }
    .app-header .kicker{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--bronze); font-size:1.2rem; margin:0 0 .1rem; }
    .app-header h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:3rem; letter-spacing:.01em; line-height:1.04; margin:0; }
    .app-header .tagline{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--muted); font-size:1.1rem; margin:.55rem 0 0; }
    .rule{ width:56px; height:1px; background:var(--bronze); opacity:.7; margin:1.1rem auto 0; }

    .actions{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; margin-bottom:2.25rem; }
    .actions button{ font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.16em; font-size:.72rem; padding:.9rem 1.6rem; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; transition:all .18s ease; }
    .actions button:hover{ background:var(--ink); color:var(--cream); }
    .actions button.primary{ background:var(--ink); color:var(--cream); }
    .actions button.primary:hover{ background:var(--bronze); border-color:var(--bronze); }
    .actions button:disabled{ opacity:.4; cursor:default; }

    h2{ display:flex; align-items:center; gap:1.1rem; font-family:'Inter',sans-serif; font-weight:500; text-transform:uppercase; letter-spacing:.3em; font-size:.7rem; color:var(--bronze); margin:2.25rem 0 1.15rem; }
    h2::before, h2::after{ content:""; flex:1; height:1px; background:var(--line); }

    .card{ background:var(--paper); border:1px solid var(--line); padding:1.4rem 1.5rem; margin-bottom:1.25rem; }
    .hero{ height:120px; margin:-1.4rem -1.5rem 1.15rem; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
    .hero span{ font-size:3.1rem; filter:saturate(.9) drop-shadow(0 1px 2px rgba(0,0,0,.14)); }
    .card h3{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.65rem; letter-spacing:.01em; margin:0 0 .35rem; }
    .card .tags{ margin:0 0 .9rem; }
    .tag{ display:inline-block; font-size:.6rem; text-transform:uppercase; letter-spacing:.18em; color:var(--bronze); border:1px solid var(--line); padding:.18rem .55rem; margin-right:.35rem; }
    .label{ font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.22em; font-size:.64rem; color:var(--muted); margin:.95rem 0 .4rem; padding-bottom:.3rem; border-bottom:1px solid var(--line); }
    .card ul{ list-style:none; margin:.4rem 0 .2rem; padding:0; }
    .card ul li{ position:relative; padding:.13rem 0 .13rem 1rem; font-size:.95rem; }
    .card ul li::before{ content:"\00b7"; position:absolute; left:.25rem; color:var(--bronze); font-weight:700; }
    .card ul li.pad::before{ content:""; }
    .card ul li.more{ color:var(--muted); font-style:italic; }
    .card ul li.more::before{ content:""; }
    .card ol{ margin:.4rem 0 .2rem; padding-left:1.25rem; }
    .card ol li{ margin:.35rem 0; font-size:.95rem; }
    .card ol li::marker{ color:var(--bronze); font-family:'Cormorant Garamond',serif; font-weight:600; }

    .card-actions{ display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1.2rem; padding-top:1rem; border-top:1px solid var(--line); }
    .card-actions button{ font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.13em; font-size:.64rem; padding:.62rem 1.05rem; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; transition:all .18s ease; }
    .card-actions button:hover{ background:var(--ink); color:var(--cream); }
    .card-actions .primary{ background:var(--ink); color:var(--cream); }
    .card-actions .primary:hover{ background:var(--bronze); border-color:var(--bronze); }

    .history{ display:flex; gap:1rem; overflow-x:auto; padding-bottom:.5rem; }
    /* Wide screens: break the strip out of the 800px column and centre it on the viewport.
       Width is quantised to a WHOLE number of 260px cards (max 5) so a card is never
       half-shown; overflow beyond that scrolls horizontally. Card unit = 260px + 1rem gap. */
    @media (min-width: 801px){
      .history{ width:fit-content; position:relative; left:50%; transform:translateX(-50%);
                max-width:calc(2 * 260px + 1rem); }        /* 2 cards */
    }
    @media (min-width: 828px){  .history{ max-width:calc(3 * 260px + 2rem); } }  /* 3 cards */
    @media (min-width: 1104px){ .history{ max-width:calc(4 * 260px + 3rem); } }  /* 4 cards */
    @media (min-width: 1380px){ .history{ max-width:calc(5 * 260px + 4rem); } }  /* 5 cards */
    .history .card{ width:260px; flex:0 0 auto; margin-bottom:0; cursor:pointer;
                    transition:transform .16s ease, box-shadow .16s ease; }
    .history .card:hover{ transform:translateY(-4px); box-shadow:0 10px 24px rgba(33,28,22,.14); }
    .history .hero{ height:78px; margin:-1.4rem -1.5rem .9rem; }
    .history .hero span{ font-size:2.2rem; }
    /* Fixed width: long titles are clipped to one line with an ellipsis. */
    .history .card h3{ font-size:1.3rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .day{ font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.2em; font-size:.6rem; color:var(--bronze); margin-bottom:.3rem; }

    details{ border-top:1px solid var(--line); margin-top:2.5rem; padding:1.1rem 0 0; }
    summary{ cursor:pointer; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.2em; list-style:none; }
    summary::-webkit-details-marker{ display:none; }
    .chatrow{ display:flex; gap:.7rem; margin-top:1rem; }
    .chatrow input{ flex:1; padding:.6rem .2rem; border:none; border-bottom:1px solid var(--ink); background:transparent; font-family:'Cormorant Garamond',serif; font-size:1.15rem; color:var(--ink); }
    .chatrow input:focus{ outline:none; border-color:var(--bronze); }
    .chatrow button{ font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.13em; font-size:.64rem; padding:.55rem 1.1rem; border:1px solid var(--ink); background:transparent; cursor:pointer; }

    #toast{ position:fixed; bottom:1.6rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); padding:.75rem 1.3rem; font-size:.66rem; text-transform:uppercase; letter-spacing:.14em; opacity:0; transition:opacity .2s; pointer-events:none; }
    #toast.show{ opacity:.97; }
    .empty{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--muted); font-size:1.1rem; }
    .empty.err{ color:#a3372f; }
    .loading{ animation:pulse 1.1s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{opacity:.4} 50%{opacity:1} }

    /* Suggestion card reveal: a sheet of paper unfolding downward from the top edge. */
    @keyframes unfold{
      0%{   opacity:0; transform:perspective(1600px) rotateX(-88deg); }
      55%{  opacity:1; transform:perspective(1600px) rotateX(10deg); }
      100%{ opacity:1; transform:perspective(1600px) rotateX(0deg); }
    }
    #suggestion .card.unfold{
      transform-origin:top center;
      animation:unfold .6s cubic-bezier(.22,.68,.28,1) both;
      box-shadow:0 10px 28px rgba(33,28,22,.10);
    }
    @media (prefers-reduced-motion: reduce){
      #suggestion .card.unfold{ animation:none; }
    }

    /* A history recipe opened into the suggestion panel: 'drawn from the deck'. */
    #suggestion .card.deck{
      transform-origin:center bottom;
      animation:deckDraw .58s cubic-bezier(.2,.68,.24,1) both;
      box-shadow:0 14px 34px rgba(33,28,22,.16);
    }
    @keyframes deckDraw{
      0%{   opacity:0; transform:translateY(120px) scale(.5) rotate(-10deg); }
      55%{  opacity:1; transform:translateY(-10px) scale(1.02) rotate(2deg); }
      100%{ opacity:1; transform:translateY(0) scale(1) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce){ #suggestion .card.deck{ animation:none; } }

    /* ---- Stickers (post-cook handwritten notes) ---------------------------- */
    .recipe-wrap{ position:relative; }
    /* On wide screens the sticker margin lives in the whitespace to the RIGHT of the card. */
    .sticker-margin{ position:absolute; top:0; left:calc(100% + 20px); width:180px; height:100%;
                     display:flex; flex-direction:column; gap:.7rem; }
    .add-sticker{ font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.13em;
                  font-size:.6rem; padding:.5rem .7rem; border:1px dashed var(--bronze);
                  background:var(--cream); color:var(--bronze); cursor:pointer; align-self:flex-start;
                  position:sticky; top:1rem; z-index:6; }
    .add-sticker:hover{ background:var(--bronze); color:var(--cream); border-style:solid; }

    /* A note: warm paper, slight hand-placed tilt, Cormorant italic body. */
    .sticker{ position:relative; background:#fdf6df; border:1px solid #e8dcae;
              box-shadow:0 4px 12px rgba(33,28,22,.14); padding:.65rem .7rem .8rem;
              transform:rotate(-1.4deg); transition:transform .12s ease; }
    .sticker:nth-child(even){ transform:rotate(1.2deg); }
    .sticker:focus-within{ transform:rotate(0); }
    .sticker .sticker-target{ font-family:'Inter',sans-serif; text-transform:uppercase;
                              letter-spacing:.16em; font-size:.52rem; color:var(--bronze);
                              margin-bottom:.3rem; }
    .sticker textarea, .sticker .sticker-text{
        font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
        font-size:1.12rem; line-height:1.3; color:var(--ink); width:100%;
        white-space:pre-wrap; word-break:break-word; }
    .sticker textarea{ border:none; background:transparent; resize:none; outline:none; overflow:hidden; }
    .sticker .sticker-del{ position:absolute; top:.25rem; right:.3rem; border:none;
                           background:transparent; cursor:pointer; font-size:.85rem; opacity:.5;
                           line-height:1; padding:.1rem; }
    .sticker .sticker-del:hover{ opacity:1; }
    .sticker .sticker-count{ font-family:'Inter',sans-serif; font-size:.5rem; color:var(--muted);
                             text-align:right; margin-top:.15rem; }

    /* Collapsed pin: a small bronze marker anchored on the card at its target. */
    .sticker-pin{ position:absolute; width:20px; height:20px; border-radius:50% 50% 50% 0;
                  background:var(--bronze); border:2px solid #fdf6df; transform:rotate(-45deg);
                  box-shadow:0 2px 5px rgba(33,28,22,.3); cursor:grab; z-index:5; }
    .sticker-pin:active{ cursor:grabbing; }
    .sticker-pin.dragging{ opacity:.85; z-index:20; }
    .sticker-pin::after{ content:""; position:absolute; top:5px; left:5px; width:6px; height:6px;
                         border-radius:50%; background:#fdf6df; }
    /* Drop-target highlight while dragging a pin. */
    .sticky-hot{ outline:2px dashed var(--bronze); outline-offset:3px; background:rgba(154,123,70,.06); }

    /* Narrow screens: no room on the right — stack the margin below the recipe. */
    @media (max-width: 1180px){
      .sticker-margin{ position:static; left:auto; width:auto; height:auto; margin-top:1rem;
                       flex-direction:row; flex-wrap:wrap; }
      .add-sticker{ position:static; }
      .sticker{ width:180px; }
    }

    /* ---- Hamburger menu + inventory drawer (issue #14) --------------------- */
    /* Hamburger: three lines that morph into an X when the drawer opens. */
    .menu-btn{ position:fixed; top:1.1rem; right:1.1rem; z-index:43; width:44px; height:44px;
               border:1px solid var(--line); background:var(--paper); cursor:pointer; padding:0;
               display:flex; align-items:center; justify-content:center; }
    .menu-btn:hover{ border-color:var(--ink); }
    .menu-btn .bars{ position:relative; width:20px; height:14px; }
    .menu-btn .bars span{ position:absolute; left:0; width:100%; height:2px; background:var(--ink);
                          border-radius:1px; transition:transform .3s ease, opacity .2s ease, top .3s ease; }
    .menu-btn .bars span:nth-child(1){ top:0; }
    .menu-btn .bars span:nth-child(2){ top:6px; }
    .menu-btn .bars span:nth-child(3){ top:12px; }
    /* Morph to X while the drawer is open. */
    body.drawer-open .menu-btn .bars span:nth-child(1){ top:6px; transform:rotate(45deg); }
    body.drawer-open .menu-btn .bars span:nth-child(2){ opacity:0; }
    body.drawer-open .menu-btn .bars span:nth-child(3){ top:6px; transform:rotate(-45deg); }
    @media (prefers-reduced-motion: reduce){ .menu-btn .bars span{ transition:none; } }

    /* Small dropdown listing menu options (structured to allow future items). */
    .menu-pop{ position:fixed; top:3.4rem; right:1.1rem; z-index:44; background:var(--paper);
               border:1px solid var(--line); box-shadow:0 8px 24px rgba(33,28,22,.14);
               min-width:180px; display:none; }
    .menu-pop.show{ display:block; }
    .menu-pop button{ display:block; width:100%; text-align:left; background:transparent; border:none;
                      font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.16em;
                      font-size:.66rem; color:var(--ink); padding:.85rem 1.1rem; cursor:pointer; }
    .menu-pop button:hover{ background:var(--cream); color:var(--bronze); }

    /* Backdrop: blurs and dims the page behind the drawer. */
    .drawer-backdrop{ position:fixed; inset:0; z-index:41; background:rgba(33,28,22,.28);
                      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
                      opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease; }
    body.drawer-open .drawer-backdrop{ opacity:1; visibility:visible; }

    /* Right-hand slide-in drawer. */
    .drawer{ position:fixed; top:0; right:0; z-index:42; height:100vh; width:33vw; min-width:320px;
             max-width:480px; background:var(--paper); border-left:1px solid var(--line);
             box-shadow:-12px 0 32px rgba(33,28,22,.14); transform:translateX(100%);
             transition:transform .32s cubic-bezier(.22,.68,.28,1); display:flex; flex-direction:column;
             overflow-y:auto; }
    body.drawer-open .drawer{ transform:translateX(0); }
    @media (max-width: 640px){ .drawer{ width:92vw; min-width:0; max-width:none; } }
    @media (prefers-reduced-motion: reduce){ .drawer{ transition:none; } .drawer-backdrop{ transition:none; } }

    .drawer-head{ display:flex; align-items:baseline; justify-content:space-between;
                  padding:1.6rem 1.5rem 1rem; border-bottom:1px solid var(--line); }
    .drawer-head h2{ margin:0; display:block; font-family:'Cormorant Garamond',serif; font-style:normal;
                     font-weight:600; text-transform:none; letter-spacing:.01em; font-size:1.9rem;
                     color:var(--ink); }
    .drawer-head h2::before, .drawer-head h2::after{ content:none; }
    .drawer-body{ padding:1.1rem 1.5rem 2rem; }

    .inv-group{ margin-bottom:.9rem; border-top:1px solid var(--line); }
    /* Each location folds by default; the summary is the tappable header. */
    .inv-group > summary{ list-style:none; cursor:pointer; display:flex; align-items:center;
                          justify-content:space-between; gap:.8rem; padding:.9rem 0;
                          font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.22em;
                          font-size:.66rem; color:var(--bronze); }
    .inv-group > summary::-webkit-details-marker{ display:none; }
    .inv-group > summary::after{ content:"+"; font-size:1rem; letter-spacing:0; color:var(--muted); }
    .inv-group[open] > summary::after{ content:"\2013"; }   /* en dash when expanded */
    .inv-group .inv-loc{ display:flex; align-items:center; gap:.6rem; }
    .inv-group .inv-count{ font-size:.62rem; color:var(--muted); letter-spacing:.1em; }
    .inv-subgroup{ margin:.2rem 0 1rem; }
    .inv-subgroup:last-child{ margin-bottom:.4rem; }
    .inv-subhead{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--muted);
                  font-size:1rem; margin:.5rem 0 .1rem; }
    .inv-list{ list-style:none; margin:.4rem 0 0; padding:0; }
    .inv-item{ padding:.6rem 0; border-bottom:1px solid var(--line); }
    .inv-item:last-child{ border-bottom:none; }
    .inv-row{ display:flex; align-items:baseline; justify-content:space-between; gap:1rem; }
    .inv-name{ font-family:'Cormorant Garamond',serif; font-size:1.2rem; color:var(--ink); }
    .inv-qty{ font-family:'Inter',sans-serif; font-size:.82rem; color:var(--muted); white-space:nowrap; }
    .inv-meta{ margin-top:.25rem; display:flex; flex-wrap:wrap; gap:.35rem; }
    .inv-meta .tag{ margin-right:0; }
    .inv-meta .opened{ color:var(--bronze); border-color:var(--bronze); }
  </style>
</head>
<body>
  <button id="menuBtn" class="menu-btn" type="button" aria-label="Open menu"
          aria-haspopup="true" aria-expanded="false" aria-controls="menuPop" onclick="onMenuButton()">
    <span class="bars"><span></span><span></span><span></span></span>
  </button>
  <div id="menuPop" class="menu-pop" role="menu" aria-label="Menu">
    <button type="button" role="menuitem" onclick="openInventory()">Inventory</button>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()" hidden></div>
  <aside id="inventoryDrawer" class="drawer" role="dialog" aria-modal="true"
         aria-labelledby="drawerTitle" aria-hidden="true" tabindex="-1">
    <div class="drawer-head">
      <h2 id="drawerTitle">Inventory</h2>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <header class="app-header">
    <p class="kicker">Le Petit Dîner</p>
    <h1>Toddler Dinner Planner</h1>
    <p class="tagline">Wholesome dinners, composed from what your kitchen already holds</p>
    <div class="rule"></div>
  </header>

  <div class="actions">
    <button class="primary" onclick="tonight()">Tonight's Dinner</button>
    <button onclick="newIdea()">New Idea</button>
    <button onclick="planTomorrow()">Plan Tomorrow</button>
  </div>

  <h2>Suggestion</h2>
  <div id="suggestion"><p class="empty">Select an option above to compose tonight's dinner.</p></div>

  <h2>Recently Cooked</h2>
  <div id="history" class="history"><p class="empty">Loading…</p></div>

  <details>
    <summary>More options — a note to the kitchen</summary>
    <div class="chatrow">
      <input id="chat" placeholder="add broccoli · make it dairy-free · swap chicken for tofu · plan tomorrow"
             onkeydown="if(event.key==='Enter')sendChat()" />
      <button onclick="sendChat()">Send</button>
    </div>
  </details>

  <div id="toast"></div>

<script>
let mode = 'tonight';   // 'tonight' | 'plan'
let current = null;     // recipe shown in the suggestion card
let histEntries = [];

// ---- deterministic hero: colour from the title, emoji from the DISH ---------
// Ordered priority list (first match wins). We match the TITLE first (it names the dish), then
// fall back to ingredients/tags. Ordering matters: specific bakes (pancake/muffin) and proteins
// come before a generic "cake", so "Salmon Fish Cakes" -> fish but "Orange Yogurt Cake" -> cake.
const HERO = [
  // baked goods & desserts (these name the dish; specific first)
  ["pancake","🥞"],["hotcake","🥞"],["pikelet","🥞"],["waffle","🧇"],
  ["cupcake","🧁"],["muffin","🧁"],["cheesecake","🍰"],["cookie","🍪"],["biscuit","🍪"],
  ["brownie","🍫"],["pudding","🍮"],["custard","🍮"],["doughnut","🍩"],["donut","🍩"],
  ["scone","🍞"],["smoothie","🥤"],
  ["eggplant","🍆"],["aubergine","🍆"],
  // proteins / fish (beat a generic "cake" so savoury cakes aren't desserts)
  ["chicken","🍗"],["nugget","🍗"],["beef","🥩"],["steak","🥩"],["lamb","🍖"],
  ["pork","🥓"],["bacon","🥓"],["sausage","🌭"],["salmon","🐟"],["tuna","🐟"],
  ["hoki","🐟"],["cod","🐟"],["fish","🐟"],["prawn","🦐"],["shrimp","🦐"],
  ["fritter","🧆"],["rissole","🧆"],["meatball","🧆"],["patty","🧆"],["dumpling","🥟"],
  ["potato","🥔"],["kumara","🍠"],["pumpkin","🎃"],
  // generic cake (dessert) — only reached when it isn't a fish/potato/etc. cake
  ["cake","🍰"],
  // composed dishes
  ["soup","🍲"],["broth","🍲"],["stew","🍲"],["casserole","🍲"],["hotpot","🍲"],
  ["curry","🍛"],["dahl","🍛"],["dhal","🍛"],
  ["risotto","🍚"],["pilaf","🍚"],["paella","🥘"],["fried rice","🍚"],["rice","🍚"],
  ["spaghetti","🍝"],["macaroni","🍝"],["lasagne","🍝"],["lasagna","🍝"],["pasta","🍝"],
  ["noodle","🍜"],["ramen","🍜"],["pizza","🍕"],["quiche","🥧"],["pie","🥧"],
  ["sandwich","🥪"],["wrap","🌯"],["taco","🌮"],["toast","🍞"],["bread","🍞"],
  ["porridge","🥣"],["oatmeal","🥣"],["oat","🥣"],["cereal","🥣"],["yoghurt","🥣"],["yogurt","🥣"],
  ["omelette","🍳"],["omelet","🍳"],["frittata","🍳"],["scramble","🍳"],
  // plant proteins
  ["tofu","🧈"],["tempeh","🧈"],["lentil","🥘"],["chickpea","🫘"],["bean","🫘"],["peas","🫙"],
  // egg (late, so it never hijacks a cake/bake)
  ["egg","🍳"],
  // veg & fruit
  ["broccoli","🥦"],["cauliflower","🥦"],["carrot","🥕"],["spinach","🥬"],["corn","🌽"],
  ["tomato","🍅"],["mushroom","🍄"],["avocado","🥑"],
  ["banana","🍌"],["apple","🍎"],["pear","🍐"],["orange","🍊"],["mango","🥭"],
  ["blueberry","🫐"],["berry","🫐"],
];
function heroFor(r){
  let h=0; for(const c of (r.title||"")) h=(h*31+c.charCodeAt(0))>>>0;
  const hue1=h%360, hue2=(hue1+40)%360;
  const title=(r.title||"").toLowerCase();
  const rest=((r.tags||[]).join(" ")+" "+(r.ingredients||[]).map(i=>i.name).join(" ")).toLowerCase();
  let emoji="🍲";
  // Match the title first (it names the dish); only then fall back to ingredients/tags.
  for(const src of [title, rest]){
    const hit = HERO.find(([k])=>src.includes(k));
    if(hit){ emoji=hit[1]; break; }
  }
  return `<div class="hero" style="background:linear-gradient(135deg,hsl(${hue1},34%,82%),hsl(${hue2},38%,68%))"><span>${emoji}</span></div>`;
}

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function ingLi(i){ return `<li>${esc(i.quantity)} ${esc(i.unit)} ${esc(i.name)}</li>`; }

function recipeCardHTML(r, buttons){
  const ings = (r.ingredients||[]).map(ingLi).join("");
  const steps = (r.steps||[]).map((s,i)=>`<li data-step="${i}">${esc(s)}</li>`).join("");
  const tags = (r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const equip = (r.equipment||[]).map(e=>`<li>${esc(e)}</li>`).join("");
  const tips = (r.tips||[]).map(t=>`<li>${esc(t)}</li>`).join("");
  const equipSection = equip
    ? `<div class="section" data-sec="equipment"><div class="label">Equipment</div><ul>${equip}</ul></div>` : "";
  const tipsSection = tips
    ? `<div class="section" data-sec="tips"><div class="label">Tips</div><ul>${tips}</ul></div>` : "";
  return `<div class="card">${heroFor(r)}
    <h3>${esc(r.title)}</h3>
    <div class="tags">${tags}</div>
    <div class="section" data-sec="ingredients"><div class="label">Ingredients</div><ul>${ings}</ul></div>
    ${equipSection}
    <div class="section" data-sec="method"><div class="label">Method</div><ol>${steps}</ol></div>
    ${tipsSection}
    <div class="card-actions">${buttons}</div></div>`;
}

// ---- state helpers ---------------------------------------------------------
function scrollToSuggestion(){
  document.getElementById('suggestion').scrollIntoView({behavior:'smooth', block:'center'});
}
// Bring the TOP of a card as close to the viewport's vertical centre as possible.
// Uses the offsetTop chain (layout position) instead of getBoundingClientRect, so an in-flight
// reveal animation (e.g. the 'deck' translate/scale) doesn't skew the scroll target.
// (Browser clamps to [0, maxScroll], so near page top/bottom it lands as centred as it can.)
function scrollCardTopToCenter(el){
  let top = 0;
  for(let n = el; n; n = n.offsetParent) top += n.offsetTop;
  window.scrollTo({ top: top - window.innerHeight / 2, behavior: 'smooth' });
}
function setBusy(on){
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=on);
  if(on){
    document.getElementById('suggestion').innerHTML = '<p class="empty loading">Composing your dinner…</p>';
    scrollToSuggestion();   // jump to the Suggestion section on every action
  }
}
function showError(msg){ document.getElementById('suggestion').innerHTML = `<p class="empty err">${esc(msg)}</p>`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

async function api(path, body){
  const opts = { headers:{'Content-Type':'application/json'} };
  if(body!==undefined){ opts.method='POST'; opts.body=JSON.stringify(body); }
  try { return await (await fetch(path, opts)).json(); }
  catch(e){ return {error:'Network error — is the server running?'}; }
}
async function apiMethod(method, path, body){
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(body!==undefined){ opts.body = JSON.stringify(body); }
  try { return await (await fetch(path, opts)).json(); }
  catch(e){ return {error:'Network error'}; }
}

// ---- render suggestion / plan ---------------------------------------------
function render(d){
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);
  if(d.error){ showError(d.error); return; }
  if(!d.recipe && d.message){ current=null; showInfo(d.message); return; }   // Case 1: empty cookbook
  current = d.recipe;
  const isPlan = d.source==='plan';
  let header='';
  const lines=[];
  if(d.note) lines.push(esc(d.note));
  if(d.repeat) lines.push("You’ve cooked everything recently — here’s a repeat.");
  if(isPlan){
    const buy = (d.groceries||[]).map(g=>g.name);
    lines.push(`For ${esc(d.for_date)} · to buy: <b>${buy.length?esc(buy.join(', ')):'nothing — all in the fridge'}</b>`);
  } else if(d.source==='cookbook' && (d.missing||[]).length){
    lines.push(`From your cookbook · you're missing: <b>${esc(d.missing.join(', '))}</b>`);
  }
  header = lines.map(l=>`<p class="empty">${l}</p>`).join('');
  const btns = isPlan
    ? `<button onclick="save()">Save to Cookbook</button><button onclick="feelingLucky()">Feeling Lucky</button>`
    : `<button class="primary" onclick="cooked()">Cooked It</button><button onclick="save()">Save to Cookbook</button><button onclick="feelingLucky()">Feeling Lucky</button>`;
  document.getElementById('suggestion').innerHTML = header + recipeCardHTML(current, btns);
  // Play the unfold reveal, then smoothly bring the card to the centre of the viewport.
  const card = document.querySelector('#suggestion .card');
  if(card){
    card.classList.add('unfold');
    requestAnimationFrame(()=>scrollCardTopToCenter(card));
  }
  mountStickers();
}

// ---- actions ---------------------------------------------------------------
async function tonight(){ mode='tonight'; setBusy(true); render(await api('/api/tonight', {})); }
async function newIdea(){ mode='tonight'; setBusy(true); render(await api('/api/new-idea', {})); }
async function planTomorrow(){ mode='plan'; setBusy(true); render(await api('/api/plan-tomorrow', {})); }
async function feelingLucky(){ setBusy(true); render(await api('/api/feeling-lucky', {mode, exclude: current ? [current.title] : null})); }

async function save(){
  if(!current) return;
  const d = await api('/api/recipe/save', {recipe:current});
  if(d.error){ showError(d.error); return; }
  toast(`Saved “${d.title}” to your cookbook`);
  // A freshly-saved recipe now has an id — make stickers available immediately (no refresh).
  if(d.id!=null){
    current.id = d.id;
    if(!document.querySelector('#suggestion .recipe-wrap')) mountStickers();
  }
}
async function cooked(){
  if(!current) return;
  const d = await api('/api/recipe/cooked', {recipe:current});
  if(d.error){ showError(d.error); return; }
  toast(`Recorded “${d.title}” as cooked today`);
  document.getElementById('suggestion').innerHTML = '<p class="empty">Recorded. Choose an option for another idea.</p>';
  current = null;
  loadHistory();
}

// ---- history ---------------------------------------------------------------
function dayLabel(iso){
  const d=new Date(iso+'T00:00:00'); const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((today-d)/86400000);
  return diff<=0?'Today':diff===1?'Yesterday':`${diff} days ago`;
}
async function loadHistory(){
  const d = await api('/api/history');   // no days param -> server uses profile.history_days
  const el = document.getElementById('history');
  if(d.error){ el.innerHTML=`<p class="empty err">${esc(d.error)}</p>`; return; }
  histEntries = d.entries||[];
  if(!histEntries.length){ el.innerHTML='<p class="empty">No dinners recorded yet.</p>'; return; }
  el.innerHTML = histEntries.map((e,idx)=>{
    // Fixed height: always render 5 ingredient slots (padded if fewer), plus one trailing
    // slot that shows '…' when the recipe has more than 5 ingredients (else blank).
    const all = e.recipe.ingredients||[];
    const rows = all.slice(0,5).map(ingLi);
    while(rows.length<5) rows.push('<li class="pad">&nbsp;</li>');
    rows.push(all.length>5 ? `<li class="more">… +${all.length-5} more</li>` : '<li class="pad">&nbsp;</li>');
    return `<div class="card" onclick="openHistory(${idx})" title="View recipe">${heroFor(e.recipe)}
      <div class="day">${esc(dayLabel(e.served_on))}</div>
      <h3>${esc(e.recipe.title)}</h3>
      <div class="label">Ingredients</div><ul>${rows.join("")}</ul>
      <div class="card-actions"><button class="primary" onclick="event.stopPropagation(); cookAgain(${idx})">Cooked It Today</button></div></div>`;
  }).join("");
}

// ---- history detail: open into the suggestion panel ('drawn from the deck') --
function openHistory(i){
  const e = histEntries[i]; if(!e) return;
  current = e.recipe; mode = 'tonight';
  const btns = `<button class="primary" onclick="cooked()">Cooked It</button>`
             + `<button onclick="save()">Save to Cookbook</button>`
             + `<button onclick="feelingLucky()">Feeling Lucky</button>`;
  const header = `<p class="empty">From your history · ${esc(dayLabel(e.served_on))}</p>`;
  const sug = document.getElementById('suggestion');
  sug.innerHTML = header + recipeCardHTML(current, btns);
  const card = sug.querySelector('.card');
  if(card){
    card.classList.add('deck');   // deck-draw reveal (instead of the unfold)
    requestAnimationFrame(()=>scrollCardTopToCenter(card));
  }
  mountStickers();
}

async function cookAgain(i){
  const r = histEntries[i].recipe;
  const d = await api('/api/recipe/cooked', {recipe:r});
  if(d.error){ showError(d.error); return; }
  toast(`Recorded “${r.title}” as cooked today`);
  loadHistory();
}

// ---- chat (exceptions) -----------------------------------------------------
function showInfo(msg){ document.getElementById('suggestion').innerHTML = `<p class="empty">${esc(msg)}</p>`; }

async function sendChat(){
  const el=document.getElementById('chat'); const v=el.value.trim(); if(!v) return;
  el.value='';
  setBusy(true);
  const d = await api('/api/chat', {message:v, recipe:current, mode});
  document.querySelectorAll('.actions button').forEach(b=>b.disabled=false);
  if(d.recipe){
    render(d);                                   // updated (or unchanged) card
    mode = (d.source==='plan') ? 'plan' : 'tonight';
    if(d.message) toast(d.message);              // e.g. no-op / guardrail note
    return;
  }
  if(d.message){ showInfo(d.message); return; }  // nothing on screen to keep
  render(d);                                       // error path handled in render()
}

// ---- stickers (post-cook handwritten notes) --------------------------------
let activeStickerLayer = null;

function mountStickers(){
  activeStickerLayer = null;
  if(!current || current.id==null) return;   // only persisted recipes get stickers
  const sug = document.getElementById('suggestion');
  const card = sug.querySelector('.card');
  if(!card) return;
  const wrap = document.createElement('div'); wrap.className = 'recipe-wrap';
  card.parentNode.insertBefore(wrap, card); wrap.appendChild(card);
  const margin = document.createElement('div'); margin.className = 'sticker-margin';
  const addBtn = document.createElement('button');
  addBtn.type = 'button'; addBtn.className = 'add-sticker'; addBtn.textContent = '+ Add Sticker';
  margin.appendChild(addBtn); wrap.appendChild(margin);
  const layer = new StickerLayer(current.id, wrap, card, margin);
  addBtn.addEventListener('click', ()=>layer.addDraft());
  activeStickerLayer = layer;
  layer.load();
}
window.addEventListener('resize', ()=>{ if(activeStickerLayer) activeStickerLayer.renderPins(); });
// Click on empty space (not a sticker/pin/add button) folds all open notes.
document.addEventListener('pointerdown', (e)=>{
  const L = activeStickerLayer; if(!L) return;
  if(e.target.closest('.sticker') || e.target.closest('.sticker-pin') || e.target.closest('.add-sticker')) return;
  L.collapseAll();
});

class StickerLayer {
  constructor(recipeId, wrap, card, margin){
    this.recipeId = recipeId; this.wrap = wrap; this.card = card; this.margin = margin;
    this.items = [];
    this.open = new Set();   // ids of currently expanded stickers (multiple allowed)
    this.draft = false;      // a new, unsaved blank note is showing
  }
  async load(){
    const d = await api(`/api/recipe/${this.recipeId}/stickers`);
    if(d.error){ return; }
    this.items = d.stickers || [];
    this.open.clear(); this.draft = false;
    this.margin.querySelectorAll('.sticker').forEach(n=>n.remove());
    this.renderPins();
  }
  anchorEl(s){
    if(s.target_step_index!=null) return this.card.querySelector(`[data-step="${s.target_step_index}"]`);
    if(s.target_section) return this.card.querySelector(`[data-sec="${s.target_section}"]`);
    return null;   // general
  }
  topInWrap(el){
    const w = this.wrap.getBoundingClientRect(), e = el.getBoundingClientRect();
    return e.top - w.top;
  }
  targetLabel(s){
    if(s.target_step_index!=null) return 'Method · step '+(s.target_step_index+1);
    if(s.target_section) return s.target_section;
    return 'general';
  }
  firstLine(t){ return String(t||'').split('\n')[0].slice(0,60); }

  renderPin(s, anchor, offset){
    const pin = document.createElement('div');
    pin.className = 'sticker-pin'; pin.title = this.firstLine(s.content);
    pin.style.top = (this.topInWrap(anchor)+2)+'px';
    pin.style.left = (this.card.offsetWidth - 26 - offset*15)+'px';
    this.wire(pin, s);
    this.wrap.appendChild(pin);
  }
  renderChip(s){
    const chip = document.createElement('div');
    chip.className = 'sticker-pin'; chip.style.position='static'; chip.style.transform='rotate(0)';
    chip.title = this.firstLine(s.content);
    this.wire(chip, s);
    this.margin.appendChild(chip);
  }
  wire(pin, s){
    let moved = false, sx = 0, sy = 0, hot = null;
    const onMove = (e)=>{
      if(!moved && Math.hypot(e.clientX-sx, e.clientY-sy) < 5) return;
      if(!moved){ moved = true; pin.classList.add('dragging'); pin.style.position='absolute'; pin.style.pointerEvents='none'; this.wrap.appendChild(pin); }
      const w = this.wrap.getBoundingClientRect();
      pin.style.left = (e.clientX - w.left - 10)+'px';
      pin.style.top  = (e.clientY - w.top - 10)+'px';
      const el = this.dropTarget(e.clientX, e.clientY);
      if(hot && hot!==el.node) hot.classList.remove('sticky-hot');
      hot = el.node; if(hot) hot.classList.add('sticky-hot');
    };
    const onUp = (e)=>{
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if(hot) hot.classList.remove('sticky-hot');
      if(moved){ this.setTarget(s, this.dropTarget(e.clientX, e.clientY)); }
      else { this.expand(s, pin); }   // a click (no drag) → expand (keeps others open)
    };
    pin.addEventListener('pointerdown', (e)=>{
      e.preventDefault(); sx=e.clientX; sy=e.clientY; moved=false;
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }
  dropTarget(x, y){
    const el = document.elementFromPoint(x, y);
    if(el && this.card.contains(el)){
      const step = el.closest('[data-step]');
      if(step) return {node:step, step:+step.dataset.step};
      const sec = el.closest('[data-sec]');
      if(sec) return {node:sec, section:sec.dataset.sec};
    }
    return {node:null};   // dropped off the recipe → general
  }
  async setTarget(s, drop){
    const body = {set_target:true, target_section:null, target_step_index:null};
    if(drop.step!=null) body.target_step_index = drop.step;
    else if(drop.section) body.target_section = drop.section;
    const d = await apiMethod('PATCH', `/api/stickers/${s.id}`, body);
    if(d.sticker){ this.replace(d.sticker); }
    this.renderPins();
  }
  replace(s){ const i = this.items.findIndex(x=>x.id===s.id); if(i>=0) this.items[i]=s; else this.items.push(s); }

  // Rebuild only the collapsed pins/chips; open notes in the margin are left untouched
  // so editing several at once never loses in-progress text.
  renderPins(){
    this.wrap.querySelectorAll('.sticker-pin').forEach(n=>n.remove());
    this.margin.querySelectorAll('.sticker-pin').forEach(n=>n.remove());
    const cluster = {};
    for(const s of this.items){
      if(this.open.has(s.id)) continue;   // shown as an open note
      const anchor = this.anchorEl(s);
      if(anchor){
        const key = s.target_step_index!=null ? 's'+s.target_step_index : 'x'+s.target_section;
        cluster[key] = (cluster[key]||0) + 1;
        this.renderPin(s, anchor, cluster[key]-1);
      } else {
        this.renderChip(s);
      }
    }
  }
  expand(s, pin){
    this.open.add(s.id);
    if(pin) pin.remove();
    this.appendNote(s);
  }
  appendNote(s){   // s === null → a new draft
    const isDraft = !s;
    const note = document.createElement('div'); note.className = 'sticker';
    note.dataset.sid = isDraft ? 'draft' : String(s.id);
    note.innerHTML = `<div class="sticker-target">${esc(isDraft ? 'general' : this.targetLabel(s))}</div>`
      + (isDraft ? '' : `<button class="sticker-del" title="Delete" type="button">🗑</button>`)
      + `<textarea maxlength="280" placeholder="Your note…"></textarea>`
      + `<div class="sticker-count"></div>`;
    const ta = note.querySelector('textarea'); const cnt = note.querySelector('.sticker-count');
    ta.value = isDraft ? '' : s.content;
    const fit = ()=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; cnt.textContent = ta.value.length+'/280'; };
    ta.addEventListener('input', fit); requestAnimationFrame(fit);
    if(!isDraft) note.querySelector('.sticker-del').addEventListener('mousedown', (e)=>{ e.preventDefault(); this.del(s, note); });
    this.margin.appendChild(note);
    ta.focus(); if(!isDraft) ta.setSelectionRange(ta.value.length, ta.value.length);
    return note;
  }
  addDraft(){
    if(this.draft) return;   // one draft at a time
    this.draft = true;
    this.appendNote(null);
  }
  async del(s, note){
    await apiMethod('DELETE', `/api/stickers/${s.id}`);
    this.items = this.items.filter(x=>x.id!==s.id);
    this.open.delete(s.id);
    if(note) note.remove();
    this.renderPins();
  }
  // Save every open note + the draft, then fold all back to pins ("click the white space").
  async collapseAll(){
    const notes = [...this.margin.querySelectorAll('.sticker')];
    if(!notes.length){ return; }
    for(const note of notes){
      const sid = note.dataset.sid;
      const val = note.querySelector('textarea').value.trim();
      if(sid === 'draft'){
        if(val){ const d = await api(`/api/recipe/${this.recipeId}/stickers`, {content:val}); if(d.sticker) this.items.push(d.sticker); }
      } else {
        const s = this.items.find(x=>String(x.id)===sid);
        if(s){
          if(!val){ await apiMethod('DELETE', `/api/stickers/${s.id}`); this.items = this.items.filter(x=>x.id!==s.id); }
          else if(val!==s.content){ const d = await apiMethod('PATCH', `/api/stickers/${s.id}`, {content:val}); if(d.sticker) this.replace(d.sticker); }
        }
      }
      note.remove();
    }
    this.open.clear(); this.draft = false;
    this.renderPins();
  }
}

// ---- hamburger menu + inventory drawer (issue #14) -------------------------
const LOCATION_LABELS = { fridge:'Fridge', shelf:'Shelf', freezer:'Freezer' };
let menuOpen = false;
let drawerOpen = false;
let lastFocus = null;          // element to restore focus to when the drawer closes

function menuBtnEl(){ return document.getElementById('menuBtn'); }

function openMenu(){
  menuOpen = true;
  document.getElementById('menuPop').classList.add('show');
  menuBtnEl().setAttribute('aria-expanded', 'true');
}
function closeMenu(){
  menuOpen = false;
  document.getElementById('menuPop').classList.remove('show');
  menuBtnEl().setAttribute('aria-expanded', 'false');
}
function toggleMenu(){ menuOpen ? closeMenu() : openMenu(); }

// The top-right button: acts as an X (close) while the drawer is open, else toggles the menu.
function onMenuButton(){ drawerOpen ? closeDrawer() : toggleMenu(); }

function openInventory(){
  closeMenu();
  openDrawer();
}

function openDrawer(){
  if(drawerOpen) return;
  drawerOpen = true;
  lastFocus = document.activeElement;
  const backdrop = document.getElementById('drawerBackdrop');
  const drawer = document.getElementById('inventoryDrawer');
  backdrop.hidden = false;
  document.body.classList.add('drawer-open');
  drawer.setAttribute('aria-hidden', 'false');
  menuBtnEl().setAttribute('aria-label', 'Close inventory');
  drawer.focus();
  loadInventory();
}

function closeDrawer(){
  if(!drawerOpen) return;
  drawerOpen = false;
  const backdrop = document.getElementById('drawerBackdrop');
  const drawer = document.getElementById('inventoryDrawer');
  document.body.classList.remove('drawer-open');
  drawer.setAttribute('aria-hidden', 'true');
  menuBtnEl().setAttribute('aria-label', 'Open menu');
  // Hide the backdrop from the a11y tree only after the slide-out transition.
  setTimeout(()=>{ if(!drawerOpen) backdrop.hidden = true; }, 340);
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

async function loadInventory(){
  const body = document.getElementById('drawerBody');
  body.innerHTML = '<p class="empty loading">Checking your kitchen…</p>';
  const d = await api('/api/inventory');
  if(d.error){ body.innerHTML = `<p class="empty err">Couldn’t load your inventory — ${esc(d.error)}</p>`; return; }
  const groups = d.groups || [];
  if(!groups.length){ body.innerHTML = '<p class="empty">Nothing in your fridge yet.</p>'; return; }
  body.innerHTML = groups.map(g=>{
    const label = esc(LOCATION_LABELS[g.location] || g.location);
    const count = (g.items||[]).length;
    return `<details class="inv-group">
      <summary><span class="inv-loc">${label}</span><span class="inv-count">${count}</span></summary>
      ${invSubgroups(g.items||[])}</details>`;   // folded by default (no 'open' attribute)
  }).join('');
}

// Subgroup a location's items by category, ordered by category name (uncategorised last).
function invSubgroups(items){
  const byCat = new Map();
  for(const it of items){
    const key = (it.category && String(it.category).trim()) || '';
    if(!byCat.has(key)) byCat.set(key, []);
    byCat.get(key).push(it);
  }
  const named = [...byCat.keys()].filter(k=>k).sort((a,b)=>a.localeCompare(b));
  const keys = byCat.has('') ? [...named, ''] : named;   // uncategorised group last
  return keys.map(key=>{
    const rows = byCat.get(key).map(invRow).join('');
    const head = key ? `<div class="inv-subhead">${esc(key)}</div>` : '';
    return `<div class="inv-subgroup">${head}<ul class="inv-list">${rows}</ul></div>`;
  }).join('');
}

function invRow(it){
  const qty = [it.quantity, it.unit].filter(v=>v!=null && v!=='').join(' ');
  const meta = [];
  if(it.opened) meta.push('<span class="tag opened">Opened</span>');
  if(it.best_before) meta.push(`<span class="tag">Best before ${esc(it.best_before)}</span>`);
  const metaHTML = meta.length ? `<div class="inv-meta">${meta.join('')}</div>` : '';
  return `<li class="inv-item">
    <div class="inv-row"><span class="inv-name">${esc(it.name)}</span>${qty ? `<span class="inv-qty">${esc(qty)}</span>` : ''}</div>
    ${metaHTML}</li>`;
}

// Esc closes the drawer (or the menu); a11y requirement.
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(drawerOpen) closeDrawer();
  else if(menuOpen) closeMenu();
});
// Click outside the menu (but not on the drawer/button) closes the open menu.
document.addEventListener('pointerdown', (e)=>{
  if(!menuOpen) return;
  if(e.target.closest('#menuPop') || e.target.closest('#menuBtn')) return;
  closeMenu();
});
// Keep focus inside the drawer while it's open (simple focus trap).
document.addEventListener('focusin', (e)=>{
  if(!drawerOpen) return;
  const drawer = document.getElementById('inventoryDrawer');
  if(drawer.contains(e.target) || e.target === menuBtnEl()) return;
  drawer.focus();
});

loadHistory();
</script>
