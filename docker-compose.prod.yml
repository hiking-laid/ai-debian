# Production compose for the NAS: run the PREBUILT image from GHCR (no source needed).
#
# Config/secrets live on the NAS and are NOT baked into the image — set them up once:
#   - .env                (TDP_POSTGRES_DSN, LLM provider/keys, TDP_WEB_PORT, ...)
#   - config/profile.yaml
#   - data/inventory.yaml
#
# Update flow on the NAS:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# (The container auto-applies DB migrations on start via the entrypoint.)
#
# If the GHCR package is private, first: `docker login ghcr.io -u aiden-liu` (PAT with read:packages).

services:
  app:
    image: ghcr.io/aiden-liu/toddler_dinner_planner:latest
    platform: linux/arm64          # the NAS CPU architecture
    pull_policy: always            # `up -d` always fetches the latest :latest
    ports:
      - "${TDP_WEB_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      # Edit config + inventory on the host (NAS) without touching the image.
      - ./config:/app/config
      - ./data:/app/data
      # Persist the GitHub Copilot device-flow token across restarts.
      - copilot-auth:/root/.toddler_dinner
    restart: unless-stopped

volumes:
  copilot-auth:
