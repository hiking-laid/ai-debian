name: Publish Docker image

# Builds a multi-arch image (incl. linux/arm64 for the NAS) and pushes it to GHCR.
#
# Because the target image lives under a DIFFERENT account (aiden-liu) than this repo
# (nzta-aiden-liu), the default GITHUB_TOKEN cannot push there. You must provide a
# Personal Access Token from the aiden-liu account as a repo secret named GHCR_PAT:
#   aiden-liu account → Settings → Developer settings → Personal access tokens
#     → Tokens (classic) → generate with scope: write:packages (and read:packages)
#   this repo → Settings → Secrets and variables → Actions → New repository secret
#     Name: GHCR_PAT   Value: <the token>
#
# First push creates the package as PRIVATE; make it public (or `docker login` on the NAS)
# to pull. On the NAS: `docker compose -f docker-compose.prod.yml pull && ... up -d`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/aiden-liu/toddler_dinner_planner
  REGISTRY_USER: aiden-liu

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
